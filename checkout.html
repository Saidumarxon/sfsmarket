<!doctype html>
<html lang="ru" data-seo-noindex="1">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Оформление заказа — Emirate Co</title>
  <meta name="description" content="Оформление заказа в интернет-магазине Emirate Co.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://www.emirateco.uz/checkout">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="mobile.css">
  <script src="emirate-seo.js"></script>
  <script src="theme.js"></script>
</head>
<body class="checkout-page">
  <header class="header">
    <div class="container header-inner">
      <a class="logo" href="index.html"><img class="logo-img" src="images/emirate-logo.svg" alt="Emirate Co" width="160" height="56"></a>
      <div class="catalog-control">
        <a class="catalog-btn" href="catalog.html">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          <span>Каталог</span>
        </a>
      </div>
      <form class="search-bar" role="search">
        <svg class="search-icon" width="18" height="18" fill="none" stroke="#94a3b8" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="search" placeholder="Поиск товаров, брендов и категорий..." autocomplete="off">
        <button type="submit">Найти</button>
      </form>
      <div class="header-actions">
        <a href="#" class="header-action-btn" title="Избранное">
          <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
          <span>Избранное</span>
        </a>
        <button class="header-action-btn theme-switch" id="themeSwitch" type="button" title="Тема" aria-pressed="false">
          <svg class="theme-icon theme-icon-moon" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
          <svg class="theme-icon theme-icon-sun" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <span>Тема</span>
        </button>
        <a href="login.html" class="header-action-btn" title="Профиль">
          <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Войти</span>
        </a>
        <a href="#" class="header-action-btn cart-action" title="Корзина">
          <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
          <span>Корзина</span>
          <i class="cart-badge" id="cartCount">0</i>
        </a>
      </div>
    </div>
  </header>

  <main class="container checkout-main">
    <nav class="breadcrumbs">
      <a href="index.html">Главная</a>
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      <a href="catalog.html?cart=1">Корзина</a>
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      <span>Оформление заказа</span>
    </nav>

    <section class="section checkout-section-visible">
      <div class="section-head">
        <h2>Оформление заказа</h2>
      </div>
      <div class="checkout-layout">
        <form class="checkout-form" id="checkoutFormPage">
          <div class="checkout-grid">
            <label>Телефон*<input name="phone" type="tel" required placeholder="+998 (__) ___-__-__"></label>
            <label>Ф.И.О*<input name="full_name" type="text" required placeholder="Введите имя"></label>
            <label>Область*<input name="region" type="text" required placeholder="Выберите"></label>
            <label>Город / Район*<input name="city" type="text" required placeholder="Выберите"></label>
          </div>
          <h4>Способ получения</h4>
          <div class="checkout-radio-group">
            <label><input type="radio" name="delivery" value="door" checked> Доставка до двери</label>
            <label><input type="radio" name="delivery" value="pickup"> Самовывоз</label>
          </div>
          <label>Адрес*<input name="address" type="text" required placeholder="Улица, дом, квартира"></label>
          <label>Комментарий к заказу<textarea name="comment" rows="4" placeholder="Дополнительные пожелания"></textarea></label>
          <h4>Способ оплаты</h4>
          <div class="checkout-radio-group">
            <label><input type="radio" name="payment" value="app" checked> Через приложение или карту</label>
            <label><input type="radio" name="payment" value="cash"> При получении (Наличными)</label>
            <label><input type="radio" name="payment" value="account"> Оплата с лицевого счета</label>
          </div>
          <label class="checkout-agree"><input type="checkbox" required> Я согласен с правилами покупки товаров</label>
          <div class="checkout-actions">
            <button type="submit" class="btn-primary">Заказать</button>
            <a href="catalog.html?cart=1" class="btn-filter-reset">Назад</a>
          </div>
        </form>
        <aside class="checkout-side">
          <h4>В корзине <span id="checkoutCount">0</span> товар(ов)</h4>
          <p class="checkout-side-total" id="checkoutTotal">0 сум</p>
          <div id="checkoutItemsPreview"></div>
        </aside>
      </div>
    </section>
  </main>

  <script src="mobile-config.js"></script>
  <script src="mobile-bridge.js"></script>
  <script src="translations.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-config.prod.js"></script>
  <script src="emirate-supabase-api.js"></script>
  <script src="emirate-auth.js"></script>
  <script src="common.js"></script>
  <script src="checkout.js"></script>
</body>
</html>
