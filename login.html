  <script>
    (function () {
      var isApp = document.documentElement.classList.contains("capacitor-app");
      var isAdmin = new URLSearchParams(window.location.search).get("admin") === "1";
      if (!isApp && window.matchMedia("(min-width: 681px)").matches) {
        window.location.replace(isAdmin ? "index.html?auth=admin" : "index.html?auth=1");
      }
    })();
  </script>
  <script src="translations.js"></script>

  <script src="supabase-config.js"></script>
  <script src="supabase-config.prod.js"></script>
  <script src="emirate-supabase-api.js"></script>
  <script>
    (function () {
      var loginModal = document.getElementById("loginModal");
      var loginForm = document.getElementById("loginForm");
      var toast = document.getElementById("profileToast");
      var toastTimer;

      function openLoginModal() {
        loginModal.classList.add("is-open");
        loginModal.setAttribute("aria-hidden", "false");
      }

      function closeLoginModal() {
        loginModal.classList.remove("is-open");
        loginModal.setAttribute("aria-hidden", "true");
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("is-visible");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toast.classList.remove("is-visible");
        }, 2800);
      }

      document.getElementById("openLoginBtn").addEventListener("click", openLoginModal);
      document.getElementById("closeLoginModal").addEventListener("click", closeLoginModal);
      loginModal.addEventListener("click", function (e) {
        if (e.target === loginModal) closeLoginModal();
      });

      document.getElementById("openRegisterLink").addEventListener("click", function (e) {
        e.preventDefault();
        var msg = (window.emirateT && window.emirateT("profile.registerSoon")) || "Регистрация скоро будет доступна";
        showToast(msg);
      });

      document.getElementById("profileLangSwitch").addEventListener("click", function () {
        var langBtn = document.getElementById("langSwitch");
        if (langBtn) langBtn.click();
      });

      document.getElementById("profileAddresses").addEventListener("click", function (e) {
        e.preventDefault();
        openLoginModal();
      });

      document.querySelectorAll(".profile-menu-group a[href='#']").forEach(function (link) {
        if (link.id === "profileAddresses") return;
        link.addEventListener("click", function (e) {
          e.preventDefault();
        });
      });

      (async function bootLogin() {
        if (window.emirateSupabaseApi && window.emirateSupabaseApi.isConfigured()) {
          var sb = window.emirateSupabase;
          var r = await sb.auth.getSession();
          if (r.data && r.data.session) {
            window.location.href = "admin.html";
            return;
          }
        } else if (localStorage.getItem("emirate_admin")) {
          window.location.href = "admin.html";
        }
      })();

      loginForm.addEventListener("submit", async function (e) {
        e.preventDefault();
        var login = document.getElementById("loginEmail").value.trim();
        var pass = document.getElementById("loginPass").value;
        var err = document.getElementById("loginError");

        if (window.emirateSupabaseApi && window.emirateSupabaseApi.isConfigured()) {
          var sb = window.emirateSupabase;
          var res = await sb.auth.signInWithPassword({ email: login, password: pass });
          if (res.error) {
            err.textContent = res.error.message || "Ошибка входа";
            err.classList.add("visible");
            setTimeout(function () { err.classList.remove("visible"); }, 5000);
            return;
          }
          var em = (res.data.user && res.data.user.email) || login;
          localStorage.setItem("emirate_admin", JSON.stringify({ user: em, role: "admin", ts: Date.now() }));
          window.location.href = "admin.html";
          return;
        }

        if (login === "admin" && pass === "admin123") {
          localStorage.setItem("emirate_admin", JSON.stringify({ user: "admin", role: "admin", ts: Date.now() }));
          window.location.href = "admin.html";
        } else {
          err.textContent = "Неверный логин или пароль";
          err.classList.add("visible");
          setTimeout(function () { err.classList.remove("visible"); }, 3000);
        }
      });
    })();
  </script>
